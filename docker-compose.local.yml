services:
  backend:
    environment:
      APP_ENV: development
      PAI_COUNSELOR_MODE: ${PAI_COUNSELOR_MODE:-deep}
      PAI_COUNSELOR_MODEL: ${PAI_COUNSELOR_MODEL:-}
      PAI_LANGUAGE_BLOCKED_SCRIPTS: ${PAI_LANGUAGE_BLOCKED_SCRIPTS:-Devanagari}
      PAI_LANGUAGE_BLOCKED_SCRIPT_REPLACEMENT: ${PAI_LANGUAGE_BLOCKED_SCRIPT_REPLACEMENT:-Roman Urdu}
      PAI_COUNSELOR_FALLBACK_REPLY: ${PAI_COUNSELOR_FALLBACK_REPLY:-I want to understand you properly. Could you tell me a little more?}
      PAI_COUNSELOR_RESEARCH_DAILY_LIMIT: ${PAI_COUNSELOR_RESEARCH_DAILY_LIMIT:-5}
      PAI_COUNSELOR_NOTEBOOK_CONTEXT_TOKENS: ${PAI_COUNSELOR_NOTEBOOK_CONTEXT_TOKENS:-1800}
      PAI_COUNSELOR_HISTORY_SIZE: ${PAI_COUNSELOR_HISTORY_SIZE:-20}
      PAI_COUNSELOR_SENSITIVE_CHECK_MAX_TOKENS: ${PAI_COUNSELOR_SENSITIVE_CHECK_MAX_TOKENS:-256}
      PAI_COUNSELOR_REASONING_EFFORT: ${PAI_COUNSELOR_REASONING_EFFORT:-low}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_BASE_URL: http://localhost:3000
      PUBLIC_API_BASE: http://localhost:8000
      WORKSPACE_ENDPOINT: http://localhost:8000
      FILE_STORAGE_BACKEND: local
      FILE_STORAGE_PATH: /data/files
    # Local uploads live on a named volume shared with the worker. Without it
    # the default path is /tmp inside THIS container: files vanish on every
    # recreate, and the worker (a separate container) can never read them, so
    # no uploaded document is ever parsed. Production uses S3 and is unaffected.
    volumes:
      - local_files:/data/files
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      APP_ENV: development
      PAI_COUNSELOR_MODE: ${PAI_COUNSELOR_MODE:-deep}
      PAI_COUNSELOR_MODEL: ${PAI_COUNSELOR_MODEL:-}
      PAI_LANGUAGE_BLOCKED_SCRIPTS: ${PAI_LANGUAGE_BLOCKED_SCRIPTS:-Devanagari}
      PAI_LANGUAGE_BLOCKED_SCRIPT_REPLACEMENT: ${PAI_LANGUAGE_BLOCKED_SCRIPT_REPLACEMENT:-Roman Urdu}
      PAI_COUNSELOR_FALLBACK_REPLY: ${PAI_COUNSELOR_FALLBACK_REPLY:-I want to understand you properly. Could you tell me a little more?}
      PAI_COUNSELOR_RESEARCH_DAILY_LIMIT: ${PAI_COUNSELOR_RESEARCH_DAILY_LIMIT:-5}
      PAI_COUNSELOR_NOTEBOOK_CONTEXT_TOKENS: ${PAI_COUNSELOR_NOTEBOOK_CONTEXT_TOKENS:-1800}
      PAI_COUNSELOR_HISTORY_SIZE: ${PAI_COUNSELOR_HISTORY_SIZE:-20}
      PAI_COUNSELOR_SENSITIVE_CHECK_MAX_TOKENS: ${PAI_COUNSELOR_SENSITIVE_CHECK_MAX_TOKENS:-256}
      PAI_COUNSELOR_REASONING_EFFORT: ${PAI_COUNSELOR_REASONING_EFFORT:-low}
      FILE_STORAGE_BACKEND: local
      FILE_STORAGE_PATH: /data/files
    volumes:
      - local_files:/data/files

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    ports:
      - "127.0.0.1:8080:80"

volumes:
  local_files:
