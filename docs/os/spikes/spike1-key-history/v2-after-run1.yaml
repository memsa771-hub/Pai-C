# Spike 1 answer key: the expected per-programme facts for the 30 shortlist programmes.
#
# Source: docs/os/spikes/PAI-OS-Programme-Shortlist-WS2027-verified.xlsx, column "Your check", where the
# developers re-read each programme's official pages (DAAD as a lead). Values are transcribed from those
# notes; where a note corrects the shortlist ("Wrong — ..."), the corrected value is used.
#
# This is a quality set kept forever (parent spec §5): it is re-run on any change to the research
# agent's prompts, models or specs. Update it only with a cited reason.
#
# Corrections after Spike 1 run 1 (2026-10-19), each from an official quote the run verified on the page;
# details in docs/os/spikes/spike1-report.md: intakes set to null where the developers' check is silent
# (the transcription had defaulted them to winter only); OVGU semester fee 311.30 and Saarland 394.30
# (current DAAD pages); TU Chemnitz Automotive Software Engineering and Web Engineering need German A1
# with the application (TU Chemnitz application page).
#
# `cycle` is the intake the developers' check refers to. Most pages show WS 2026/27 or older; only rows
# that say WS 2027/28 are for the pilot intake (see the Spike 1 design, SP1-D1).
#
# Field shapes (null = the page states nothing; the agent should then report not_found):
#   language_of_instruction: english | english_or_german | mostly_english
#   tuition_fee_non_eu_eur:  per semester; 0 = none
#   semester_contribution_eur: {value, approx: true when the check says "~" or gives an older year}
#   deadline_open / deadline_close: "MM-DD" for the non-EU winter application window in `cycle`
#   application_route: uni_assist | uni_assist_vpd | direct
#   english_requirement: {cefr, ielts, toefl_ibt, pte, other, moi_accepted}
#   german_requirement: null | {level, when: application | before_semester_3 | ...}
#   grade_requirement: null | {german_max, percent_min, note}   (German scale: lower is better)
#   admission_test: null | {applies_to, any_of: [...], waived_if}
#   intakes: [winter] | [winter, summer]
#   key_status: confirmed | needs_followup | conflict | excluded
#     needs_followup / conflict rows and the fields listed under `open_fields` are scored separately:
#     the key itself is not settled there.

