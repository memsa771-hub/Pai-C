method: >-
  Left column (name + address) split from the hospital column by position; trailing notes removed
  ('(Letter sent to M/o NHSR&C ...)', '(Provisionally recognized by erstwhile PMC)', 'Note: ...', section headers).
  Last part = (a) the last comma-separated part of the cell, or (b) the last comma-separated part of the cell's last
  printed line (address printed on its own line with no comma, e.g. 'Ayub Medical College' / 'Abbottabad').
  Normalised: lower case, non-alphanumerics to space, whitespace collapsed; must equal a KP unit name (DISTRICT/DIVISION
  dropped) exactly, or the unique space-free form. No abbreviations, no misspellings, no Cantt.

