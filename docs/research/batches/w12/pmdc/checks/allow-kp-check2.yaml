verdict:
  answer: "yes"
  reason: >-
    pmdc.pk is linked as 'Pakistan Medical and Dental Council (PMDC)' on the federal health ministry site nhsrc.gov.pk
    (second official source besides HEC), and at least 28 (my count 30) PMDC-listed MBBS/BDS colleges have an address
    whose last part is a KP district/division name per the PBS 2023 Table 1 KP file.
  caveat: "The KP region basis is the district/division rule (controller rule, for the owner to confirm), not a province word printed in the PMDC addresses."
