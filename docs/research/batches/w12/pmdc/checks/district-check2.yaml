# FU-15 research check 2 (claude-fu15-district-check-2), independent. Built before check1.yaml was read; compared afterwards.
ref: claude-fu15-district-check-2
date: '2026-11-15'
source:
  publisher: Pakistan Bureau of Statistics (pbs.gov.pk), 7th Population and Housing Census 2023, Table 1 (area, population by sex, ... annual growth rate), province files
  index_page: https://pbs.gov.pk/result-excel/ (fetched 200; its links point to the older 2020/07 xlsx tables, so the 2023 PDF file names were confirmed by WebSearch + direct curl of the census_tables/tables/
    path)
  retrieved: 2026-11-15T01:55Z, curl -sS -L, each HTTP 200 %PDF
  documents:
  - url: https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_punjab_province.pdf
    sha256: 63df3bec54bdc753d4462f830484bf57dc4ceb34eca2b37dce479c02421ff54c
    region: punjab
    sha256_equals_check1: true
  - url: https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_sindh_province.pdf
    sha256: c066bb906bdacef9bf989c0c64870c30ca9d7e7f8c9abd8a07271072600defb1
    region: sindh
    sha256_equals_check1: true
  - url: https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_kp_province.pdf
    sha256: 8924fb1b927751c0df902272f70e422ce88a7d5b5857cbb2daadf540232c3b24
    region: khyber_pakhtunkhwa
    sha256_equals_check1: true
  - url: https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_balochistan_province.pdf
    sha256: 34fcfbf77dca2ed90f2cbbe5d6536e7ca916254c2f96549bdc9fa310cbeedaa1
    region: balochistan
    sha256_equals_check1: true
  - url: https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_islamabad.pdf
    sha256: 8deb2282dd70fc564a863c26c7a0adbd7651379aade08dbcc7f8279426423da3
    region: islamabad_capital_territory
    sha256_equals_check1: true
  not_used: table_1_<province>_districts.pdf were also downloaded (HTTP 200) but not parsed or used; the rule names the province files.
  extraction: 'docker run --rm pai-ci-py, python -I, pypdf extract_text(visitor_text=...): each text chunk with its position (tm x cm). Only chunks in the first table column (x < 120 pt, the NAME OF ADMINISTRATIVE
    UNIT column, x 46.4-52.1) are read; a chunk is a unit when it is exactly "<NAME> DISTRICT" or "<NAME> DIVISION". Cross-check: whole-text word counts of DISTRICT/DIVISION per file equal the table counts.'
  first_column_rows_not_used:
  - 'table_1_punjab_province.pdf p1: PUNJAB'
  - 'table_1_sindh_province.pdf p1: SINDH'
  - 'table_1_kp_province.pdf p1: KHYBER PAKHTUNKHWA'
  - 'table_1_kp_province.pdf p2: MALAKAND PROTECTED AREA'
  - 'table_1_balochistan_province.pdf p1: BALOCHISTAN'
  - 'table_1_islamabad.pdf p1: ISLAMABAD TEHSIL'
  coverage_note: The 2023 census files cover the four provinces and Islamabad only; AJK and Gilgit-Baltistan are not in them.
match_rule: last comma-separated part of the E2 address cell; lower-case; non-alphanumeric -> space; whitespace collapsed. Matches when equal to a normalised district or division name (type word dropped);
  else when equal after removing all spaces and exactly one name has that space-free form. A name printed in two provinces does not match. Nothing else.
