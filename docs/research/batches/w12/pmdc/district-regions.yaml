# District / division -> region of backend/app/os/knowledge/regions.yaml (PK), from the PBS 2023 census Table 1
# province files (FU-15, W12 D-PMDC v2, 2026-11-15; controller rule, for the owner to confirm). Read by derive.py,
# which stops unless `units` equals the table of both checks below and its per-row result equals both checks'.
# Nothing here is typed by hand: it was written from checks/district-check2.yaml `unit_table` and compared with
# checks/district-check1.yaml `district_table` + `extended_rule.division_table` (165 = 135 districts + 30 divisions,
# identical sets of name, unit, region, doc and page).
source:
  publisher: "Pakistan Bureau of Statistics (pbs.gov.pk), 7th Population and Housing Census 2023, Table 1, province files"
  retrieved: "2026-11-15 (check 1 curl ~01:49 UTC; check 2 curl 01:55 UTC; same sha256 for every file)"
  coverage: "the four provinces and Islamabad only; AJK and Gilgit-Baltistan are not in these tables"
  documents:
    - {url: "https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_punjab_province.pdf", sha256: 63df3bec54bdc753d4462f830484bf57dc4ceb34eca2b37dce479c02421ff54c, region: punjab}
    - {url: "https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_sindh_province.pdf", sha256: c066bb906bdacef9bf989c0c64870c30ca9d7e7f8c9abd8a07271072600defb1, region: sindh}
    - {url: "https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_kp_province.pdf", sha256: 8924fb1b927751c0df902272f70e422ce88a7d5b5857cbb2daadf540232c3b24, region: khyber_pakhtunkhwa}
    - {url: "https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_balochistan_province.pdf", sha256: 34fcfbf77dca2ed90f2cbbe5d6536e7ca916254c2f96549bdc9fa310cbeedaa1, region: balochistan}
    - {url: "https://pbs.gov.pk/wp-content/uploads/census_tables/tables/table_1_islamabad.pdf", sha256: 8deb2282dd70fc564a863c26c7a0adbd7651379aade08dbcc7f8279426423da3, region: islamabad_capital_territory}
checks:
  - {ref: claude-fu15-district-check-1, file: checks/district-check1.yaml, date: "2026-11-15"}
  - {ref: claude-fu15-district-check-2, file: checks/district-check2.yaml, date: "2026-11-15"}
rule: >-
  Only where the address has no province or territory word (region-words.yaml) and only for the rows both checks judged
  (the rows the D-PMDC dry run rejected missing_region). Take the last comma-separated part of the address cell (the
  name cell where the address is empty); lower-case it; turn every non-alphanumeric character into a space; collapse
  whitespace. It matches when it equals a unit name normalised the same way (the word DISTRICT or DIVISION dropped),
  or else when it equals one with all spaces removed on both sides and exactly one unit name has that space-free form.
  A name printed in two regions never matches. No other loosening: no Cantt, no misspelling, no city that is not a
  district or division name.
units:  # name as printed (DISTRICT / DIVISION dropped); unit; region = the province of the file; doc; page
