  - step: keyword pass over all 2075 rows (name, city, source_quote, claude_note, urls). Keywords were islamabad, isb, ibd, IMCB, IMCG, "model college", polytechnic, "home economics", "federal directorate", FDE, tanveer, margalla, bharakahu, tarlai, nilore, rawat, golra, humak, sihala, tarnol, chak shahzad, and sector codes such as F-7/2. This catches region=None rows (159, all PMDC).
  - step: token pass. For each FDE line I took its distinctive tokens (normalized sector code like f7/2, and locality words, with generic words removed) and searched rows that are ICT or mention Islamabad. Every overlap, apart from generic words (road, sector, pakistan, women), is listed below as a candidate.
  - rule: a university is not a college, a campus is not its parent body, and an admission body or board is not a college.

