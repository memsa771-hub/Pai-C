# W12 D-BIEK alias check 2 (claude-w12-biek-alias-check-2), independent. 2026-11-15. Not an alias file; input for one.
# Read-only. Text source: BIEK E2 CSVs (sha256 identical to the E1 files check 1 read). Batch rows: v4 workbooks,
# Institutions sheets, read with openpyxl in `docker run --rm pai-ci-py python -I`.
# Verdicts judged from printed text only. claude_note is batch 3's own entry (SECCAP gender/level/shift), not a source
# quote, and is treated as weaker evidence than name/source_quote.
