method:
  - "Rules applied: (1) a BIEK Evening or No.2 line matches only a batch row that prints the same shift/number in name or source_quote; claude_note alone is weaker evidence. (2) a shift inferred from a sibling line is weaker evidence; accepted only where both sides are a closed two-member set and the other member matches on printed text. (3) an address or district word that differs from the batch row is a reason for unclear."
  - "Own candidate search, method A (BIEK -> batch): tokens of the full BIEK quote (name + address) against tokens of every batch row's name (all 570 rows, not screened by region); generic words dropped; document-frequency weights; a pair kept when it covered >= 50% of the batch name's weight or shared a token found in <= 4 documents. 364 pairs, read by hand."
  - "Own candidate search, method B (batch -> BIEK): for 164 batch rows that are Sindh / Karachi / National / multi-campus, each significant name token matched against BIEK quote tokens with fuzzy spelling (SequenceMatcher >= 0.8 for words of 5+ letters, e.g. Bawani/Bawany, Lyari/Liyari, Mohtarma/Muhtarma, Zulfikar/Zulfiqar). Read by hand."
  - "Extra greps of BIEK text for university/DAI names (Dadabhoy, Greenwich, Preston, Indus, ILMA, KASB, Newports, Nazeer, Saifee, SZABIST, Sohail, Salim, Baqai, Ziauddin, Habib, Hamdard, Textile, FAST/NUCES, COMSATS, NUML) and for every 'Govt. College for Women' line against KQ2236."
  - "Row count note: openpyxl gives 570 non-empty Institutions rows (354+79+72+46+19); check 1 says 572. All 14 Karachi SD-COL-KQ rows are present in both counts."
