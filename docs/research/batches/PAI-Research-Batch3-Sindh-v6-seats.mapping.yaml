# How the v6 re-entered Sindh seat values (the 34 v5 rows that had no value) and their two AI checks become a batch file
# in the one format (P2 spec §11.3). Data, read by `python -m scripts.os_values_sheet`; see the command in the
# "Derived from" sheet of PAI-Research-Batch3-Sindh-v6-seats.xlsx.
sheet: Programmes
key: programme_id
# PAI-Research-Batch3-Sindh-v6-seats-reentry.csv column -> canonical Programmes column
values:
  seat_category: seat_category
  seats: seats
  quote_verbatim: quote_verbatim
  source_url: source_url
# one entry per --check file, in the order given on the command line
checks:
  - checker: 1  # PAI-Research-Batch3-Sindh-v6-seats-reentry-check1.csv (words already in check1_results)
    columns: {check1: checker1_result, note: checker_note}
  - checker: 2  # PAI-Research-Batch3-Sindh-v6-seats-reentry-check2.csv (writes yes/no already)
    columns: {check2_result: checker2_approved, check2_note: checker_note}
    # same ruling as v5 (T14 fix round 1): a check-2 `unclear` is a doubt; such rows are held, not written.
    skip_results: [unclear]
