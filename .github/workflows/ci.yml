name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check. Branch protection expects this exact job id: `os`.
  os:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: os_test
          POSTGRES_USER: os_test
          POSTGRES_PASSWORD: os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U os_test -d os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OS_TEST_DATABASE_URL: postgresql://os_test:os_test@localhost:5432/os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Module boundaries (tach)
        working-directory: backend
        run: tach check
      - name: Single Alembic head
        working-directory: backend
        run: python scripts/check_alembic_heads.py
      - name: Guard against silently skipped DB tests
        run: test -n "$OS_TEST_DATABASE_URL" || { echo "OS_TEST_DATABASE_URL is not set"; exit 1; }
      - name: OS tests
        working-directory: backend
        # `python -m pytest` puts backend/ on sys.path (tests import `scripts.*`).
        # -rs prints the reason for any skipped test.
        run: python -m pytest tests/os -v -rs

  # Existing (Counsellor) suite. Blocking since it was green on CI twice in a
  # row (PRs #27 and #28). It only blocks merges once `legacy` is also a
  # required check in the branch ruleset.
  # No Postgres service: without OS_TEST_DATABASE_URL the DB tests skip.
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Existing test suite
        working-directory: backend
        run: python -m pytest
