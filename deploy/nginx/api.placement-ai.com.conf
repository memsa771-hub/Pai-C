# api.placement-ai.com -> backend container (127.0.0.1:8000).
# Install: sudo cp deploy/nginx/api.placement-ai.com.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/api.placement-ai.com.conf /etc/nginx/sites-enabled/
# Then `sudo certbot --nginx -d api.placement-ai.com` adds the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name api.placement-ai.com;

    # Uploads (result cards, transcripts) are allowed up to MAX_FILE_SIZE (50 MB).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat reply can take 10-20 s; document parsing requests longer.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
