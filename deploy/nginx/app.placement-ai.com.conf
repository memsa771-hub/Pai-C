# app.placement-ai.com -> frontend container (127.0.0.1:3000, Next.js standalone).
# Install: sudo cp deploy/nginx/app.placement-ai.com.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/app.placement-ai.com.conf /etc/nginx/sites-enabled/
# Then `sudo certbot --nginx -d app.placement-ai.com` adds the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name app.placement-ai.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
