[pytest]
addopts = -m "not counselor_sim and not live_research"
markers =
    counselor_sim: billed, model-backed Counselor student simulation; run explicitly with -m counselor_sim
    live_research: opt-in network-backed research evaluation; run explicitly with -m live_research
    chaos: OS runner crash test (worker subprocesses killed with SIGKILL); part of the default suite
    req(*ids): requirement IDs this test proves (docs/requirements/connection.yaml)
    standalone: PAI OS with the Counsellor module off (CI job standalone)
    connect_row(*ids): master section 6 rows (6.1 ...) this test proves; tests/os/test_connect_rows_index.py checks every P1 row has one
