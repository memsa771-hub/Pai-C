    checked_at: 2026-10-17
    status: unconfirmed
    conflict_note: "Older embassy documents give 11,208 EUR (leaflet 10/2023) and 10,236 EUR (Karachi checklist); the amount is set per year, so re-check for 2027 (Spike 5 C2)."
