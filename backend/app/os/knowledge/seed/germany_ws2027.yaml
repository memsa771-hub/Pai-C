    value: 75
    quote: "Cost for the first chosen course of study: EUR 75.00"
    url: "https://www.uni-assist.de/en/how-to-apply/apply-online/pay-submit/"
    checked_at: 2026-10-17
    status: unconfirmed
  uni_assist_fee_additional_eur:
    value: 30
    quote: "For each additional chosen course of study: EUR 30.00"
    url: "https://www.uni-assist.de/en/how-to-apply/apply-online/pay-submit/"
    checked_at: 2026-10-17
    status: unconfirmed
  # There is no visa_target_date fact (Slice 9 Task 11, F1): no official source gives one. The playbook derives the
  # visa step's date from the visa programme's semester_start (a programme fact research looks up, with its page),
  # 6 weeks before it (the visa_before_semester_days constant). No semester_start is seeded here: until research
  # finds it for a programme, visa_apply waits for it and the student is told so (Spike 5 C5).

