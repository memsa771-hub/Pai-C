# Programme facts are leads from the developers' shortlist (PAI-OS-Programme-Shortlist-WS2027.xlsx,
# gathered 2026-10-12). Nothing here is confirmed for WS 2027/28 (plan ruling R-P4): an admin confirms
# each fact through POST /v1/os/facts/{id}/confirm once its official page is re-read. Slice 2's
# research agent fills the same table.
intake_year: 2027
route_key: germany_master

route:
  blocked_account_yearly_eur:
