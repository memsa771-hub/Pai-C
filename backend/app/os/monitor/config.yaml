# Season monitoring and student reports as data (P2-D21, P2-D22). No country, board or institution names belong here.
version: 1
# A fact is monitored while it is at one of these levels.
monitored_statuses: [confirmed, verified]
# A page that answers with one of these codes is gone: the facts it backed go back to unconfirmed. Any other failure
# (a timeout, a server error, a block by robots.txt or by the source guard) changes nothing: it is not a change of the page.
gone_http: [404, 410]
# Reasons a student can give for a report. The labels the student sees are in texts.yaml (approved sentences).
report_reasons: [wrong_date, wrong_amount, page_changed, other]
# A student may report this many different facts in 24 hours; the same fact again joins its open item.
max_reported_facts_per_day: 5
report_text_max_chars: 1000
# Owner ruling 2026-11-08: a reported fact shows as "not confirmed" to everyone at once, but only the reporters' steps wait.
# Every plan's steps wait once a reviewer agrees, or this many different students have reported the same fact.
escalate_after_reporters: 3
# A change counts only when it is seen on this many separate runs (a temporary page problem must not cost a fact).
seen_runs_needed: 2
# Sanity checks on a page before it can take a fact back. A page that fails is "unreadable": nothing changes and it does
# not replace the last clean snapshot.
#  - none of the quotes of the page's facts is on it, when the page backs at least this many facts (an error page or a
#    different page; with one fact, "its quote is gone" is the very change we look for, and the two-run rule decides);
sanity_no_match_min_facts: 2
#  - the text shrank by more than this share of the last clean snapshot's text (percent).
sanity_max_shrink_percent: 60
# A sanity failure only delays a change, never hides it: a page that fails the checks on this many runs in a row is
# taken as changed (its facts go back to unconfirmed and a change item opens for the page, with the flagged snapshot).
sanity_failures_needed: 2
