# Blocked account confirmation (Slice 6b spec S6b-D6): the provider's proof of the funds paid in, for the visa file.
# Added by config only. Its amount is compared with the route's funds requirement (S6b-D7).
key: blocked_account_confirmation
version: 1
label: Blocked account confirmation
fields:
  - {name: holder_name, type: name, cross_check: full_name, hint: "The account holder's name exactly as printed"}
  - {name: provider, type: text, hint: "The bank or provider that issued the confirmation"}
  - {name: amount, type: number, hint: "The total amount paid in and blocked, as a number without currency"}
  - {name: monthly_payout, type: number, hint: "The amount paid out each month, as a number without currency, if printed"}
  - {name: issue_date, type: date, hint: "Date of the confirmation, YYYY-MM-DD"}
