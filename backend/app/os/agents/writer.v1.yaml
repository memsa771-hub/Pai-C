# The writer (Slice 5 spec S5-D4): drafts the SOP or CV from the student's answers and confirmed profile only.
# An actor with no tools: it cannot fetch, store or send anything; the os.statement workflow does (S5-D6).
id: writer
version: 1
zone: actor
tier: strong
tools: []
output: statement_draft
limits:
  max_readings: 3              # a draft and at most 2 revisions (S5-D6)
  timeout_s: 120
  spend_usd_per_artifact: 0.30
retries:
  tools: 0
  output: 2                    # invariant 7
