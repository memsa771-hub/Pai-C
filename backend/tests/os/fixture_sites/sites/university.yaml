# Fictional university with an admission notice, a JavaScript-shell page (T4) and a redirect off the list (T3).
host: www.alpha-university.test
pages:
  /robots.txt: {content_type: text/plain, body: "User-agent: *\nDisallow: /private\n"}
  /admissions/notice:
    body: |
      <html><body><h1>Admissions notice: fall 2027</h1>
      <p>Applications for BS Computing open on 1 June 2027. Applications close on 1 August 2027.</p>
      <p>Fee per semester: 1000 units.</p>
      <p><a href="/admissions/apply">How to apply</a></p></body></html>
  /admissions/apply:
    body: |
      <html><body><h1>How to apply</h1><p>Attach your transcript and a photo.</p></body></html>
  /admissions/portal:
    body: |
      <html><head><script src="/static/app.js"></script></head><body><div id="root"></div>
      <noscript>You need to enable JavaScript to run this app.</noscript></body></html>
  /static/app.js: {content_type: application/javascript, body: "document.getElementById('root').textContent='Portal';"}
  /moved: {status: 302, location: "https://elsewhere.test/page", body: ""}
  /private/page: {body: "<html><body>private</body></html>"}
