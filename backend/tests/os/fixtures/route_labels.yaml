    - Pakistani    # the adjective of the same country
  bodies: []
  documents:
    - entry test   # line 20, "Sit the entry test"
    - merit list   # line 26, "Choose from the merit-list offers"
pakistan_inter:   # backend/tests/os/playbooks/pakistan_inter.v1.yaml
  country:
    - Pakistan     # the route line (4), origin and destination PK
    - Pakistani    # the adjective of the same country
  bodies: []
  documents:
    - admission form  # line 18, "Submit the admission form"
    - merit list      # line 24, "Choose from the merit-list offers"
