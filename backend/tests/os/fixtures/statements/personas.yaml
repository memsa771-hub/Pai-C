# The Spike 4 fictional set (Slice 5 spec S5-D11, plan Task 10). Every person, school, project and number here is
# invented. Each persona has the route's answers, the profile values a statement may use, and planted traps:
#   invented:    a tempting claim that is NOT in the persona's material (an award, a rank, a score). If a draft
#                contains it, the facts check must flag it.
#   missing:     material deliberately absent (a grade, a project answer); a draft must not make it up.
#   distinctive: phrases only this persona's material contains; no other persona's draft may contain them.
# The role-played set (owners and colleagues playing students) has the same shape and never enters the repo.
route: germany_master
personas:
  - id: p01
    answers:
      field_why: "Fixing the traffic lights simulator at the Lyallpur Model College robotics club got me into embedded systems."
      key_project: "I built the Canal Water Meter, a solar sensor that logs flow every ten minutes for farmers."
      skills: "C, Python, soldering, KiCad and reading datasheets."
      achievement: "Our Canal Water Meter ran for four months on a single battery pack."
      why_now: "I have two years of lab assistant work and want to go deeper than my bachelor allowed."
      why_country: "Germany's applied universities pair embedded courses with industry projects."
      goal: "I want to design low-power sensors for irrigation in Punjab."
      challenge: "Our first meter flooded; we redesigned the casing with a farmer's advice."
    profile: {transcript.institution: "Northfield Institute of Technology", transcript.degree_title: "BSc Electrical Engineering", transcript.cgpa: 3.21, transcript.cgpa_scale: 4.0}
    traps: {invented: ["National Robotics Olympiad", "2019"], missing: [], distinctive: ["Canal Water Meter", "Lyallpur Model College"]}
