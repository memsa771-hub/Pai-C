# The 12 fictional rehearsal students (Slice 9a spec §2.4). Test data only (invariant 12 covers app/os, not tests).
#
# programmes: 2-3 of the seeded Germany programmes that have the facts an application step needs (deadline and route).
# bundle: a Spike 2 sample bundle (tests/os/fixtures/documents/samples, b1..b5): the student's passport, degree,
#   transcript, SSC, HSSC and English test. Bundles 3 and 4 carry planted mistakes (a different father's name on the
#   transcript; a swapped date of birth on the HSSC certificate): S2 and S4 use them and `resolve` gives the right value.
#   The other students use the consistent bundles 1 and 5. The driver makes the four documents the samples lack
#   (minimum passing grade letter, admission letter, blocked account, insurance) from the bundle's own name.
# answers: the interview, the admission result per programme, the programme the visa file is for, the contact details
#   the student types into the pack and visa file, and how they resolve a mismatch.
# event: S3 rejected, S5 missing_document, S7 late, S9 approved_changed, S11 ignore_big, the others none.
#   S3 and S11 are both "Not admitted" by one programme: S3 accepts the suggestion that follows, S11 ignores it.
#   S5 holds back its minimum passing grade letter (`withhold`) until a support case is opened for its plan.
#   S7 does nothing on its inbox until a deadline is at risk and the plan asks for the step.
#   S9 changes its approved SOP once every pack is approved, so the packs change after approval.

common:
  interview: &interview
    field_why: "Building a small weather station in school started my interest in how software meets hardware."
    key_project: "In my final project I wrote the firmware for a low-power sensor board and cut its power use by half."
    skills: "C and Python from my courses, used in the sensor project; teamwork from leading a lab group of four."
    achievement: "My final-year project was graded among the best of my class."
    why_now: "I finished my bachelor's degree and want to deepen it before I start full-time work."
    why_country: "The programmes combine strong teaching with close links to industry and applied research."
    goal: "I want to work as an engineer on embedded or intelligent systems."
    challenge: "When our project board failed a week before the deadline, I rebuilt the test plan and we finished on time."

