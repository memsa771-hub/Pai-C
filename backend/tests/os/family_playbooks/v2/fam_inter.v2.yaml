# P3-T1 fixture: version 2 of fam_inter, to test that a pinned plan keeps its upgrade line with the flag off.
key: fam_inter
version: 2
family: alphafam
route: {origin: ZZ, destination: ZZ, level: intermediate}
default_timezone: UTC
intake_terms: [winter]
tasks:
  - template_key: apply_form
    task_type: student.act
    title: Submit the application form
    kind: student
    inbox_kind: act
    duration_days: 1
  - template_key: offer
    task_type: student.choose
    title: Choose from the offers (v2)
    kind: student
    inbox_kind: choose
    fan_out: programme
    depends_on: [{key: apply_form}]
    anchor: {fact: offer_date}
    duration_days: 2
